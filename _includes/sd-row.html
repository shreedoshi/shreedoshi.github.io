{% assign p = include.post %}
{% assign fig = p.thumbnail | default: p.image | default: p.poster_image %}
<li class="sd-row">
  <a class="sd-row__fig" href="{{ p.url | relative_url }}" tabindex="-1" aria-hidden="true">
    {% if fig and fig != "" %}
      <img src="{{ fig | relative_url }}" alt="" loading="lazy">
    {% else %}
      <span class="sd-row__empty sd-row__empty--{{ p.section | default: 'research' }}"></span>
    {% endif %}
  </a>
  <div class="sd-row__text">
    <h3 class="sd-row__title"><a href="{{ p.url | relative_url }}">{{ p.title }}</a></h3>
    {% if p.summary %}<p class="sd-row__summary">{{ p.summary }}</p>{% endif %}
    {% if p.context %}<p class="sd-row__meta">{{ p.context }}</p>{% endif %}
  </div>
</li>
