<ol class="sd-pubs">
  {% for pub in site.data.publications %}
  <li>
    <span class="sd-pubs__title">{% if pub.doi %}<a href="https://doi.org/{{ pub.doi }}">{{ pub.title }}</a>{% else %}{{ pub.title }}{% endif %}</span>
    <span class="sd-pubs__authors">{{ pub.authors | replace: "S. Doshi", "<strong>S. Doshi</strong>" }}</span>
    <span class="sd-pubs__venue"><em>{{ pub.venue }}</em> ({{ pub.year }}){% if pub.doi %}, doi:{{ pub.doi }}{% endif %}</span>
  </li>
  {% endfor %}
</ol>
