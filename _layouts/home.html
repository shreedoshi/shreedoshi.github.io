---
layout: default
---
<header class="sd-hero">
  <div class="sd-hero__text">
    <h1 class="sd-hero__name">Shree Doshi</h1>
    <p class="sd-hero__tagline">{{ page.tagline }}</p>
  </div>
  {% if page.photo %}
  <figure class="sd-hero__photo">
    <img src="{{ page.photo | relative_url }}" alt="{{ page.photo_alt | default: 'Shree Doshi' | escape }}">
  </figure>
  {% endif %}
</header>

<main id="content" class="sd-main">
  <section class="sd-prose sd-intro">
    {{ content }}
  </section>
</main>
